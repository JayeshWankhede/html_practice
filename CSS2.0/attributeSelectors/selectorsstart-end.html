<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*   /* 
        selects elemts whose attributes value starts with specified text */
        a[href^="https"]{
            color:green;
        }
         

         /* 
        selects elemts whose attributes value end with specified text
        */

        a[href $="com"]
           {
               border: 2px solid black;
               padding: 5px;
           }

    </style>
</head>
<body>
    <a href="https://meet-attendance-tracker.web.app/" target="">hyperlink</a>
<br><br>
<a href="www.com" target="">hyperlink</a>

</body>
</html>
