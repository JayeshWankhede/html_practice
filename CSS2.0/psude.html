<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

           a:link{
            color: white;
            padding: 10px;
            text-decoration: none;
            background-color: black;
            font-size: 50px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 300;
            font-style: oblique;  
            /* margin: 50px; */
         
        
        } 
        a:visited{
               color: purple;
        }
        a:hover{
              background-color: bisque;
        }
        a:active{
             background-color: brown;
             color: white;
        }


        button:hover{
            background-color: blue;
            color: white;
            padding: 10px;
        }
      

        input:focus{
              background-color: aquamarine;
              padding: 10px;
        }

         
    </style>
</head>
<body>


<a href="#">HyperPerlink</a>
<br><br>
<button>CLick here</button>

<br><br>

<input type="text" placeholder="enter the val">
    
</body>
</html>
