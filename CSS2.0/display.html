<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1,p{
            background-color: rgb(195, 160, 160);
            /* default */
            display: block; 
            width: 300px;
        }

        a{
            background-color: rgb(0, 0, 0);
            padding: 10px;
            color:aliceblue;
            display: inline;
            /* width:400px; not allowed change width onn inline */
        }
        span{
            background-color: rgb(222, 208, 208);
        }
    </style>
</head>
<body>

    <h1>J.J.JORDAN</h1>
    <h1>J.J.JORDAN</h1>

    <p>Lorem ipsum dolor sit amet.</p>

    <a href="#">Lorem ipsum dolor sit amet.</a>

    <a href="#">Lorem ipsum dolor sit amet.</a>

    <span> wellcome </span>
</body>
</html>
