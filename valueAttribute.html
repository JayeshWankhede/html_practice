<!-- Attribute selectore :

attribute selectore in css are used to select HTML element based on their attribute
 or attribute value.

 [attribute=value]
 ex you can select  all input fields  having  type="text" -->

 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[required]{
            border: 2px solid blue;
        }

        input[type="text"]{
             color: red;
        }

    </style>
 </head>
 <body>
    <input type="text" name="" id="" placeholder="enter the value"  >  <br><br>

    <input type="email" name="" id="" placeholder="enter the value"  >  <br><br>

       <input type="password" name="" id="" placeholder="enter the value"  required>
 </body>
 </html>
